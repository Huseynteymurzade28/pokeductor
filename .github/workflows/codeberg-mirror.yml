name: Mirror to Codeberg

on:
  push:
  delete:
  workflow_dispatch:

concurrency:
  group: codeberg-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Push branches and tags to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git
          cd repo.git
          git push --prune \
            "https://${GITHUB_REPOSITORY_OWNER}:${CODEBERG_TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
