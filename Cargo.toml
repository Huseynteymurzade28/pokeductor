[package]
name = "pokeductor"
version = "0.3.1"
edition = "2021"
# Set by our dependency floor rather than by anything we use directly:
# `image` and `darling` both require 1.88. Enforced by the `msrv` CI job.
rust-version = "1.88"
description = "A terminal Pokedex and evolution analyzer with sprite rendering, offline type and party analysis, and an on-disk cache for offline use"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Huseynteymurzade28/pokeductor"
homepage = "https://github.com/Huseynteymurzade28/pokeductor"
keywords = ["pokemon", "pokedex", "tui", "ratatui", "cli"]
categories = ["command-line-utilities", "games"]
authors = ["Huseyn Teymurzade <teymurzadehuseyn14@gmail.com>"]
exclude = ["assets/", ".github/"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
