# Configuration for `cargo deny`, run by .github/workflows/audit.yml.

[advisories]
# Fail on any unfixed RUSTSEC advisory in the dependency tree.
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained — its author archived the
    # repository. It is not a vulnerability, and there is nothing to act on
    # here: it reaches us only through `ratatui`, no upgrade exists, and it is
    # a proc-macro crate, so it runs at compile time and contributes no code to
    # the shipped binary. Drop this entry once ratatui stops depending on it.
    "RUSTSEC-2024-0436",
]

[licenses]
# We ship a binary users install with `cargo install`, so every dependency
# needs a license that permits redistribution.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # `webpki-roots` — the Mozilla root CA bundle that `rustls-tls` ships in
    # place of the system trust store. The licence covers the certificate data
    # rather than code: CDLA-Permissive-2.0 is the Linux Foundation's data
    # licence and permits redistribution outright, with no condition beyond the
    # usual disclaimer. Shipping it is the whole point — it is what lets a
    # release binary verify TLS on a machine whose trust store we cannot see.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
